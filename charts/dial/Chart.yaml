annotations:
  category: MachineLearning
  licenses: Apache-2.0
apiVersion: v2
appVersion: "1.48.0"
dependencies:
  - name: common
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - bitnami-common
    version: 2.31.4
  - name: dial-core
    repository: file://../dial-core
    alias: core
    condition: core.enabled
    version: 6.0.0
  - name: dial-extension
    repository: file://../dial-extension
    alias: chat
    condition: chat.enabled
    version: 3.1.1
  - name: dial-extension
    repository: file://../dial-extension
    alias: themes
    condition: themes.enabled
    version: 3.1.1
  - name: dial-extension
    repository: file://../dial-extension
    alias: openai
    condition: openai.enabled
    version: 3.1.1
  - name: dial-extension
    repository: file://../dial-extension
    alias: bedrock
    condition: bedrock.enabled
    version: 3.1.1
  - name: dial-extension
    repository: file://../dial-extension
    alias: vertexai
    condition: vertexai.enabled
    version: 3.1.1
  - name: dial-extension
    repository: file://../dial-extension
    alias: dial
    condition: dial.enabled
    version: 3.1.1
  - name: ollama
    repository: file://../dial-ollama/ollama
    alias: ollama
    condition: ollama.enabled
    version: 0.1.0
description: Umbrella chart for DIAL solution
home: https://dialx.ai/
icon: "https://docs.dialx.ai/img/favicon.ico"
keywords:
  - ai-dial
kubeVersion: ">=1.23.0-0"
maintainers:
  - name: EPAM Systems
    url: https://github.com/epam
name: dial
sources:
  - https://github.com/epam/ai-dial-helm/tree/main/charts/dial
version: 8.0.0
