{{- if .Values.model.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ollama-model-pull
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- $podSecurityContext := deepCopy .Values.podSecurityContext }}
      {{- $containerSecurityContext := deepCopy .Values.containerSecurityContext }}
      {{- $adaptSecurityContext := "" }}
      {{- if and .Values.global .Values.global.compatibility .Values.global.compatibility.openshift }}
      {{- $adaptSecurityContext = .Values.global.compatibility.openshift.adaptSecurityContext | default "" }}
      {{- end }}
      {{- if or (eq $adaptSecurityContext "force") (and (eq $adaptSecurityContext "auto") (.Capabilities.APIVersions.Has "security.openshift.io/v1")) }}
      {{- $podSecurityContext = omit $podSecurityContext "fsGroup" "runAsUser" "runAsGroup" }}
      {{- $containerSecurityContext = omit $containerSecurityContext "runAsUser" "runAsGroup" }}
      {{- end }}
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: model-puller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.model.waitForService }}
              until curl -sf http://{{ .Release.Name }}-ollama:{{ .Values.service.port }}/api/version >/dev/null 2>&1; do
                echo "Waiting for Ollama API..."
                sleep 5
              done
              {{- end }}
              ollama pull {{ .Values.model.name }} || echo "Ollama is not ready yet; continuing without blocking DIAL startup"
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_HOME
              value: /tmp/ollama
            - name: OLLAMA_MODELS
              value: /tmp/ollama/models
          {{- with $containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ollama-data
              mountPath: /tmp/ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-ollama-data
{{- end }}
