{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}-ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  to:
    kind: Service
    name: {{ .Release.Name }}-ollama
  port:
    targetPort: http
  {{- if .Values.route.host }}
  host: {{ .Values.route.host | quote }}
  {{- end }}
{{- end }}
