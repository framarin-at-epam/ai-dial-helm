global:
  compatibility:
    openshift:
      adaptSecurityContext: auto

# Leave unset to allow external operators to manage .spec.replicas.
replicaCount: null

image:
  repository: ollama/ollama
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 11434

route:
  enabled: false
  host: ""
  targetPort: 11434

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce

model:
  name: gemma2:2b
  enabled: true
  # Set to true to wait for the Ollama API before pulling the model.
  # Default is false so DIAL services can start even while Ollama is still warming up.
  waitForService: false

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
