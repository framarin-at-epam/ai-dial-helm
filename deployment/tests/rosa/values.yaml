global:
  compatibility:
    openshift:
      adaptSecurityContext: auto

core:
  enabled: true
  image:
    repository: epam/ai-dial-core
    tag: 0.48.0
    #repository: ai-dial-core
    #tag: local
    #pullPolicy: Never
  podAnnotations:
    # -- Annotation hack to restart core pod after each Helm chart upgrade
    autorestart: '{{ dateInZone "2006-01-02 15:04:05Z" (now) "UTC" }}'
  configuration:
    encryption:
      secret: "KgmCRB622TJgSJKS7HJgdUM3WuNgs0W4" #"%%CORE_ENCRYPT_SECRET%%"
      key: "K78vLf9M9bUrqCCwuRYN8yI06HGuxJgP" #"%%CORE_ENCRYPT_KEY%%"
  env:
    aidial.config.files: '["/mnt/secrets-store/aidial.config.json"]'
    aidial.identityProviders.fake.jwksUrl: "http://fakeJwksUrl"
    aidial.identityProviders.fake.rolePath: "roles"
    aidial.identityProviders.fake.issuerPattern: "issuer"
    aidial.storage.prefix: "core"
  envFrom:
    - secretRef:
        name: "foundryimagerecognitiondev.openai.azure.com"
        key: "ENV_OPENAI_API_KEY"
  secrets:
    aidial.config.json: |
      {
        "models": {
          "gpt-4.1-nano": {
            "type": "chat",
            "displayName": "Azure Foundry gpt-4.1-nano",
            "iconUrl": "gpt4.svg",
            "endpoint": "https://foundryimagerecognitiondev.cognitiveservices.azure.com/openai/deployments/gpt-4.1-nano/chat/completions",
            "upstreams": [
              {
                "endpoint": "https://foundryimagerecognitiondev.cognitiveservices.azure.com/openai/deployments/gpt-4.1-nano/chat/completions?api-version=2025-01-01-preview",
                "key": "ENV_OPENAI_API_KEY"
              }
            ],
            "userRoles": ["default", "chat"]
          },
          "gemma2:2b": {
            "type": "chat",
            "displayName": "Local gemma2:2b",
            "endpoint": "http://localhost:11434/api/chat",
            "iconUrl": "http://localhost:3001/gpt3.svg",
            "upstreams": [
              {
                  "endpoint": "http://localhost:11434/api/chat",
                  "key": "<GEMMA_MODEL_API_KEY>"
              }
            ]
          }
        },
        "keys": {
          "dial_api_key": {
            "project": "TEST-PROJECT",
            "role": "default",
            "key": "dial_api_key"
          },
          "azure_foundry_api_key": {
            "project": "TEST-PROJECT",
            "role": "default",
            "key": "<azure_foundry_api_key>"
          }
        },
        "roles": {
          "chat": {
            "limits": {
              "gpt-4.1-nano": {
                "minute": "100000",
                "day": "10000000"
              }
            }
          }
        }
      }
  extraVolumes:
    - name: app-data
      emptyDir: {}
    - name: app-logs
      emptyDir: {}
    - name: config
      secret:
        secretName: '{{ template "dialCore.names.fullname" . }}'
        items:
          - key: aidial.config.json
            path: aidial.config.json
  extraVolumeMounts:
    - name: app-data
      mountPath: /app/data
    - name: app-logs
      mountPath: /app/log
    - name: config
      mountPath: "/mnt/secrets-store/aidial.config.json"
      subPath: aidial.config.json
      readOnly: true
  valkey:
    enabled: true
    auth:
      enabled: true
      aclUsers:
        default:
          password: "oT1l2HqcDVXgIoEQ5vHWfHyk8O9eq42J" #"%%REDIS_PASSWORD%%"
    podSecurityContext:
      fsGroup: null
      runAsUser: null
      runAsGroup: null
    securityContext:
      runAsUser: null

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "" #"%%CLUSTER_ISSUER%%"
    hosts:
      - dial.localhost #'%%DOMAIN%%'
    tls:
      - secretName: "dial-tls-secret"
        hosts:
          - dial.localhost #'%%DOMAIN%%'


chat:
  enabled: true
  env:
    # -- Base URL of your site for OAuth callback
    AUTH_CALLBACK_BASE_URL: "http://localhost:3000"
    # -- URL to redirect after logout
    AUTH_POST_LOGOUT_REDIRECT_URI: "http://localhost:3000"
    # -- DIAL core API endpoint
    # Internal service name (DNS name) of DIAL core service
    DIAL_CORE_URL: "dial-core.framarin-at-epam-dev.svc.cluster.local"
    # -- External or Internal URL of DIAL themes;
    # Same allowlist as for DIAL chat should be applied
    THEMES_CONFIG_URL: "http://dial-themes.framarin-at-epam-dev.svc.cluster.local"
    # -- List of DIAL chat features to enable;
    # ref: https://github.com/epam/ai-dial-chat/blob/development/libs/shared/src/types/features.ts
    ENABLED_FEATURES: "conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,likes,conversations-sharing,prompts-sharing,input-files,attachments-manager,conversations-publishing,prompts-publishing"
    # -- Default model used by the chat UI.
    DEFAULT_MODEL: "gpt-4.1-nano"
  secrets:
    AUTH_SESSION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "" #"%%CLUSTER_ISSUER%%"
    hosts:
      - chat.localhost #'%%DOMAIN%%'
    tls:
      - secretName: "chat-tls-secret"
        hosts:
          - chat.localhost #'%%DOMAIN%%'

### ai-dial-chat-themes configuration ###
themes:
  enabled: true
  image:
    repository: epam/ai-dial-chat-themes
    tag: 0.20.0
  # podSecurityContext:
